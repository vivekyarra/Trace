        SEMANTIC REASONING (powered by Anthropic Claude):

        EQUIVALENT PATTERNS:
        - "exponential backoff" ↔ "progressive delay with multiplier" ↔ "increasing wait time"
        - "polling every N seconds" ↔ "periodic retry loop" ↔ "interval-based check"
        - "synchronous HTTP call" ↔ "blocking request" ↔ "await fetch without timeout"
        - "in-memory cache" ↔ "local variable caching" ↔ "module-level Map/dict"
        - "markdown table" ↔ "pipe-delimited table formatting" ↔ "table with | separators"
        - "ASCII diagram" ↔ "box-drawing characters" ↔ "text-based visual layout"
        - "plaintext password" ↔ "unhashed credential" ↔ "stored without bcrypt/argon2"

        CONFLICT exists when:
        - New code implements an approach explicitly REJECTED in a stored decision
        - New code removes or bypasses a deliberately placed constraint
        - New code implements a semantically equivalent pattern to one rejected
        - Documentation changes contradict a formatting/style decision

