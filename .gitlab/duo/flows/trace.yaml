      - "create_issue_note"
      - "create_issue"
      - "update_issue"
      - "get_wiki_page"
      - "gitlab_wiki_blob_search"
      - "gitlab_api_get"
      - "gitlab_issue_search"
      - "gitlab_note_search"
      - "gitlab_merge_request_search"
    ui_log_events:
