  # ── 7. ONBOARDING AGENT (new member briefing) ────────────────
  - name: "onboarding_agent"
    type: AgentComponent
    prompt_id: "onboarding_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
