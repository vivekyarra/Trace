version: "v1"
environment: ambient

# ──────────────────────────────────────────────────────────────────
#  COMPONENTS — seven agents, one entry-point router + six workers
# ──────────────────────────────────────────────────────────────────
components:
  # ── 1. TRIAGE ROUTER ──────────────────────────────────────────
  - name: "triage_router"
    type: AgentComponent
    prompt_id: "triage_router_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "get_issue"
      - "list_issue_notes"
      - "list_all_merge_request_notes"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  # ── 2. SPECFORGE AGENT (issues — PRE-MORTEM + FOLLOW-UP) ─────
  - name: "specforge_agent"
    type: AgentComponent
    prompt_id: "specforge_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "list_all_merge_request_notes"
      - "build_review_merge_request_context"
      - "create_merge_request_note"
      - "update_merge_request"
      - "get_issue"
      - "list_issue_notes"
      - "create_issue_note"
      - "create_issue"
      - "update_issue"
      - "get_wiki_page"
      - "gitlab_wiki_blob_search"
      - "gitlab_api_get"
      - "gitlab_issue_search"
      - "gitlab_note_search"
      - "gitlab_merge_request_search"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  # ── 3. GUARDKEEPER AGENT (open MRs) ──────────────────────────
  - name: "guardkeeper_agent"
    type: AgentComponent
    prompt_id: "guardkeeper_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "list_all_merge_request_notes"
      - "build_review_merge_request_context"
      - "create_merge_request_note"
      - "update_merge_request"
      - "get_issue"
      - "list_issue_notes"
      - "create_issue_note"
      - "create_issue"
      - "update_issue"
      - "get_wiki_page"
      - "gitlab_wiki_blob_search"
      - "gitlab_api_get"
      - "gitlab_issue_search"
      - "gitlab_note_search"
      - "gitlab_merge_request_search"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  # ── 4. REPLY HANDLER AGENT (trace: commands) ──────────────────
  - name: "reply_handler_agent"
    type: AgentComponent
    prompt_id: "reply_handler_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "list_all_merge_request_notes"
      - "build_review_merge_request_context"
      - "create_merge_request_note"
      - "update_merge_request"
      - "get_issue"
      - "list_issue_notes"
      - "create_issue_note"
      - "create_issue"
      - "update_issue"
      - "get_wiki_page"
      - "gitlab_wiki_blob_search"
      - "gitlab_api_get"
      - "gitlab_issue_search"
      - "gitlab_note_search"
      - "gitlab_merge_request_search"
    ui_log_events:
      - "on_agent_final_answer"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

  # ── 5. Tracekeeper AGENT (merged MRs) ─────────────────────────
  - name: "tracekeeper_agent"
    type: AgentComponent
    prompt_id: "tracekeeper_prompt"
    inputs:
      - from: "context:goal"
        as: "user_goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "list_merge_request_diffs"
      - "list_all_merge_request_notes"
      - "build_review_merge_request_context"
      - "create_merge_request_note"
      - "update_merge_request"
      - "get_issue"
      - "list_issue_notes"
