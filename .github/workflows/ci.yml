name: Verify Trace

on:
  push:
    branches: ["main", "develop", "feature/**", "phase/**", "release/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: verify-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[aws,cockroach,test]"
      - name: Run runtime tests
        run: python -m pytest tests
      - name: Static and bytecode checks
        run: |
          python -m ruff check trace_memory
          python -m compileall -q trace_memory
      - name: Build and smoke-test the installed artifact
        run: |
          python -m pip install "build>=1.2,<2"
          python -m build
          python -m venv /tmp/trace-wheel
          /tmp/trace-wheel/bin/python -m pip install dist/trace_memory-0.2.0-py3-none-any.whl
          /tmp/trace-wheel/bin/trace-runtime --help
      - name: Check migration shape
        run: |
          test -f migrations/001_canonical_memory.sql
          test -f migrations/002_runtime_operations.sql
          grep -q "CREATE VECTOR INDEX" migrations/001_canonical_memory.sql
          grep -q "VECTOR(1024)" migrations/001_canonical_memory.sql
          grep -q "schema_migrations" migrations/002_runtime_operations.sql
      - name: Validate AWS infrastructure
        run: |
          python -m pip install "cfn-lint>=1.38,<2"
          cfn-lint infra/aws.yaml
      - name: Build and smoke-test the runtime image
        run: |
          docker build --tag "trace:${GITHUB_SHA}" .
          docker run --rm "trace:${GITHUB_SHA}" --help
      - name: Audit Python dependencies
        run: |
          python -m pip install "pip-audit>=2.9,<3"
          python -m pip_audit --skip-editable
