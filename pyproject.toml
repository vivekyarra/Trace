[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-memory"
version = "0.2.0"
description = "Trace's CockroachDB-backed institutional memory runtime"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "sqlalchemy>=2.0,<3"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
cockroach = ["psycopg[binary]>=3.2,<4", "psycopg2-binary>=2.9,<3", "sqlalchemy-cockroachdb>=2.0.2,<3"]
test = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[project.scripts]
trace-runtime = "trace_memory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trace_memory", "trace_memory.*"]
exclude = ["legacy*", "trace-cli*", "tests*"]

[tool.setuptools.data-files]
"share/trace/migrations" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
