AWSTemplateFormatVersion: '2010-09-09'
Description: Trace durable task queue, dead-letter queue, alarms, and runtime IAM policy

Parameters:
  RuntimeRoleName:
    Type: String
    Description: Existing ECS or App Runner task role that runs Trace
  AlarmTopicArn:
    Type: String
    Description: SNS topic for production alerts
  BedrockReasoningModelArn:
    Type: String
  BedrockEmbeddingModelArn:
    Type: String

Resources:
  TraceDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: trace-tasks-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      KmsMasterKeyId: alias/aws/sqs
      MessageRetentionPeriod: 1209600

  TraceTaskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: trace-tasks.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId
      KmsMasterKeyId: alias/aws/sqs
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TraceDeadLetterQueue.Arn
        maxReceiveCount: 3

  TraceRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: trace-runtime-least-privilege
      Roles: [!Ref RuntimeRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
            Resource: [!GetAtt TraceTaskQueue.Arn]
          - Effect: Allow
            Action: [bedrock:InvokeModel]
            Resource: [!Ref BedrockReasoningModelArn, !Ref BedrockEmbeddingModelArn]

  TraceDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Trace has poison tasks requiring operator review
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt TraceDeadLetterQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

  TraceOldestMessageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Trace task processing is delayed by more than five minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt TraceTaskQueue.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]

Outputs:
  QueueUrl: {Value: !Ref TraceTaskQueue}
  QueueArn: {Value: !GetAtt TraceTaskQueue.Arn}
  DeadLetterQueueUrl: {Value: !Ref TraceDeadLetterQueue}
