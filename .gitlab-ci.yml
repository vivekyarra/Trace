# =============================================================================
# LORE CI/CD Pipeline
# =============================================================================
# Infrastructure for the LORE GitLab Duo agent/flow project.
#
# Stages:
#   1. validate  — lint YAML and enforce catalog size limits
#   2. sync      — publish to GitLab AI Catalog on version tags
#   3. health    — scheduled LORECAST health-check audits
# =============================================================================

stages:
  - validate
  - sync
  - health
  - pages

# ---------------------------------------------------------------------------
# Stage 1: validate
# ---------------------------------------------------------------------------
# Runs on every push that touches agent or flow definitions.
# Catches syntax errors and the 64 KiB AI Catalog payload limit early.
# ---------------------------------------------------------------------------
validate-yaml:
  stage: validate
  image: python:3.12-slim
  rules:
    # Trigger when any YAML inside agents/ or flows/ changes
    - changes:
        - "agents/**/*.yml"
        - "flows/**/*.yml"
  script:
    - echo "==> Validating YAML syntax of agent and flow files..."

    # Validate every .yml file under agents/ and flows/
    - |
      EXIT_CODE=0
      for f in $(find agents flows -name '*.yml' 2>/dev/null); do
        echo "  checking $f"
        python3 -c "
      import sys, yaml
      try:
          yaml.safe_load(open('$f'))
          print('    OK')
      except yaml.YAMLError as e:
          print(f'    FAIL: {e}', file=sys.stderr)
          sys.exit(1)
      " || EXIT_CODE=1
      done
      exit $EXIT_CODE

    # Enforce the 64 KiB (65536 bytes) AI Catalog size limit on flow.yml
    - |
      FLOW_FILE="flows/flow.yml"
      if [ -f "$FLOW_FILE" ]; then
        SIZE=$(wc -c < "$FLOW_FILE" | tr -d ' ')
        LIMIT=65536
        echo "==> $FLOW_FILE size: ${SIZE} bytes (limit: ${LIMIT})"
        if [ "$SIZE" -gt "$LIMIT" ]; then
          echo "ERROR: $FLOW_FILE exceeds the 64 KiB AI Catalog limit!" >&2
          exit 1
        fi
      fi

    - echo "==> All validations passed."

test-lore-cli:
  stage: validate
  image: python:3.12-slim
  rules:
    - changes:
        - "lore-cli/**/*"
  script:
    - echo "==> Installing lore-cli and test dependencies..."
    - pip install ./lore-cli[test] || pip install ./lore-cli && pip install pytest
    - echo "==> Running lore-cli tests..."
    - python -m pytest lore-cli/tests/ -v

# ---------------------------------------------------------------------------
# Stage 2: sync
# ---------------------------------------------------------------------------
# Publishes the project to the GitLab AI Catalog whenever a version tag
# (e.g. v1.0.0) is pushed.
#
# Prerequisites:
#   - Set the CI/CD variable CATALOG_SYNC_TOKEN in
#     Settings > CI/CD > Variables (masked & protected).
#   - See README.md for details.
# ---------------------------------------------------------------------------
catalog-sync:
  stage: sync
  image: curlimages/curl:latest
  rules:
    # Only run on tags that look like semver releases
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
  script:
    - echo "==> Syncing LORE to GitLab AI Catalog (tag $CI_COMMIT_TAG)..."

    # Trigger the AI Catalog sync via the GitLab API
    - |
      curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: ${CATALOG_SYNC_TOKEN}" \
        --request POST \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/catalog/publish" \
        --data-urlencode "tag_name=${CI_COMMIT_TAG}" \
      && echo "==> Catalog sync succeeded for ${CI_COMMIT_TAG}." \
      || { echo "ERROR: Catalog sync failed." >&2; exit 1; }

sync-memories:
  stage: sync
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
  script:
    - echo "==> Installing lore-cli..."
    - pip install ./lore-cli
    - echo "==> Syncing memories from issues to wiki pages..."
    - lore sync --project-id $CI_PROJECT_ID --gitlab-url $CI_SERVER_URL --token $CATALOG_SYNC_TOKEN

# ---------------------------------------------------------------------------
# Stage 3: health
# ---------------------------------------------------------------------------
# Placeholder for scheduled LORECAST health audits.
#
# To activate:
#   1. Go to CI/CD > Schedules and create a new schedule
#      (e.g. daily at 06:00 UTC, weekly on Monday, etc.).
#   2. Replace the placeholder script below with the actual
#      LORECAST invocation once the health-check tooling is ready.
# ---------------------------------------------------------------------------
lorecast-scheduled:
  stage: health
  image: python:3.12-slim
  rules:
    # Only run on pipeline schedules — never on push or MR events
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - echo "==> LORECAST scheduled health audit"
    - echo "    This is a placeholder job."
    - echo "    To enable real health checks, replace this script with"
    - echo "    the LORECAST CLI invocation or API call, for example:"
    - echo ""
    - echo '    python3 -m lorecast audit --format gitlab-report'
    - echo ""
    - echo "    See AGENTS.md for the full LORECAST specification."
    - echo "==> Done (no-op)."

# ---------------------------------------------------------------------------
# Stage 4: pages
# ---------------------------------------------------------------------------
# Generates a self-contained HTML dashboard from LORE memories and publishes
# it to GitLab Pages.  Runs on the default branch and version tags.
# ---------------------------------------------------------------------------
pages:
  stage: pages
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+/'
  script:
    - echo "==> Installing lore-cli..."
    - pip install ./lore-cli
    - echo "==> Generating LORE dashboard..."
    - lore dashboard --from-file examples/sample-memories.txt --output public/
  artifacts:
    paths:
      - public
